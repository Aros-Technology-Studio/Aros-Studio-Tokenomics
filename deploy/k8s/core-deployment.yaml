apiVersion: apps/v1
kind: Deployment
metadata:
  name: ast-core
  namespace: ast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ast-core
  template:
    metadata:
      labels:
        app: ast-core
    spec:
      containers:
        - name: core
          image: ghcr.io/aros-technology-studio/ast-core:1.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ast-config
          env:
            - name: PORT
              value: "3000"
            - name: AST_JOURNAL_DIR
              value: /data/journal
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ast-secrets
                  key: DATABASE_URL
                  optional: true
            - name: AST_INSTITUTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ast-secrets
                  key: AST_INSTITUTION_TOKEN
                  optional: true
          volumeMounts:
            - name: journal
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: ast-journal-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ast-journal-pvc
  namespace: ast
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
