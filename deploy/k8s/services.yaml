apiVersion: v1
kind: Service
metadata:
  name: ast-core
  namespace: ast
spec:
  selector:
    app: ast-core
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ast-portal-edge
  namespace: ast
spec:
  selector:
    app: ast-portal-edge
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: ast-portal-ui
  namespace: ast
spec:
  selector:
    app: ast-portal-ui
  ports:
    - port: 3200
      targetPort: 3200
